actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. ARMO Platform's documented public API is
    request/response REST (base /api/v1, X-API-KEY auth). Runtime detection is
    produced by an in-cluster eBPF sensor and read back over REST polling, not a
    customer-facing WebSocket, so no AsyncAPI document was created.
