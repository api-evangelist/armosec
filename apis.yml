aid: armosec
url: https://raw.githubusercontent.com/api-evangelist/armosec/refs/heads/main/apis.yml
name: ARMO
kind: company
description: ARMO is the cloud-native and Kubernetes security company behind the
  leading open-source project Kubescape. ARMO Platform is a runtime-driven CNAPP
  that unifies Kubernetes Security Posture Management (KSPM), vulnerability and
  image scanning, compliance frameworks, network and seccomp policy generation,
  and runtime Cloud Application Detection and Response (CADR) - correlating
  runtime behavior with posture and vulnerabilities to cut alert noise. ARMO
  exposes a documented REST API over HTTPS (base https://api.armosec.io/api/v1 in
  the EU region and https://api.us.armosec.io/api/v1 in the US region),
  authenticated with an account access key sent in the X-API-KEY header. The API
  covers clusters, workloads, vulnerabilities, posture and compliance, security
  risks, runtime incidents, attack chains, network and runtime policies, registry
  scanning, and integrations. API access is available to platform customers who
  have generated an Agent Access Key; the endpoints below are documented but the
  data returned requires a connected account and clusters.
