openapi: 3.2.0
info:
  description: 'Documentation of Armo Platform API

    How to get the API key Get the API key from the Armo platform


    Navigate to the https://cloud.armosec.io


    Click on Settings (bottom left corner)


    Under the Agent Access Keys section, generate a new access key or use an existing one.


    Copy and save the access key, as it will not appear again.


    Using the API Key in Requests Pass the access key in the request headers under the key x-api-key as shown below:

    curl -X ''POST'' \

    ''https://api.armosec.io/api/v1/some-endpoint'' \

    -H ''accept: application/json'' \

    -H ''x-api-key: YOUR_ACCESS_KEY'' \

    -d ''{}'''
  title: ARMO PLATFORM Login API
  version: 1.0.0
servers:
- url: https://api.armosec.io/api/v1
- url: http://api.armosec.io/api/v1
security:
- customerGUID:
  - '[]'
- accessKey:
  - '[]'
- openID:
  - '[]'
tags:
- name: Login
paths:
  /login:
    post:
      description: Get session cookie for specific user + customer
      tags:
      - Login
      operationId: postLogin
      responses:
        '200':
          $ref: '#/components/responses/LoginResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                customer:
                  description: Customer name to log the user into.
                  type: string
                  x-go-name: CustomerName
                  example: test-customer
                customerGuid:
                  description: Customer GUID to log the user into.
                  type: string
                  x-go-name: CustomerGUID
                  example: 0f42fbe3-d81e-444d-8cc7-bc892c7623e9
                email:
                  description: The user Email as provided to CyberArmor identities system
                  type: string
                  x-go-name: Email
                  example: xyz@test.otg
                password:
                  description: The user password as provided to CyberArmor identities system
                  type: string
                  x-go-name: Password
                  example: '*********'
        required: true
      summary: Post login
      x-summary-source: derived
  /logout:
    delete:
      description: Logout specific oauth2 session and revoke the access token.
      tags:
      - Login
      summary: Logout
      operationId: deleteLogout
      responses:
        '200':
          description: ''
  /oauth2/login:
    get:
      description: 'Redirect to oauth2 login page of a given provider.

        After the authentication process finished, redirect back to `callback`, with `status` URL parameter, which can be either, `success` or `error`'
      tags:
      - Login
      summary: Redirect to oauth2 login page
      operationId: getOauth2Login
      parameters:
      - x-go-name: Provider
        name: provider
        in: query
        required: true
        schema:
          type: string
      - x-go-name: Redirect
        name: callback
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
  /open_id_callback:
    get:
      description: 'All the query params provided by CyberArmor identities system and need to be passed to this API

        state

        code'
      tags:
      - Login
      summary: Returns URL to for login with callback
      operationId: getOpenIdCallback
      responses:
        '200':
          $ref: '#/components/responses/OpenIdCallbackResponse'
  /open_id_url:
    get:
      description: Returns URL to CyberArmor identities system so the user can log in with username / Email + password and starting Oauth2 login flow
      tags:
      - Login
      summary: Returns URL to for login
      operationId: getOpenIdUrl
      responses:
        '200':
          $ref: '#/components/responses/OpenIdUrlResponse'
  /openid_customers:
    get:
      tags:
      - Login
      summary: Get the list of customers this user allowed to
      operationId: getOpenidCustomers
      responses:
        '200':
          $ref: '#/components/responses/OpenidCustomersResponse'
    post:
      tags:
      - Login
      operationId: postOpenidCustomers
      responses:
        '200':
          $ref: '#/components/responses/LoginResponse'
      summary: Post openid customers
      x-summary-source: derived
  /v1/customerAttributes:
    get:
      tags:
      - Login
      summary: Get various information on this user + customer
      operationId: getCustomerAttributes
      responses:
        '200':
          $ref: '#/components/responses/CustomerAttributesRespose'
