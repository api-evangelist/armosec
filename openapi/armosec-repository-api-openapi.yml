      x-go-package: github.com/armosec/armoapi-go/armotypes
    RepoEntitySummary:
      type: object
      title: RepoEntitySummary summary of repo scanning entity.
      properties:
        childCount:
          description: 'Number of children of the entity. For `file`s entity it would be

            the amount of the resources inside this file, and for `repo`s -

            the amount of scanned files'
          type: integer
          format: uint64
          x-go-name: ChildCount
          example: 13
        controlsInfo:
          description: 'Information about the controls that were run on this entity

            The key is the status of the control (`failed`, `passed`, etc)'
          type: object
