openapi: 3.2.0
info:
  description: 'Documentation of Armo Platform API

    How to get the API key Get the API key from the Armo platform


    Navigate to the https://cloud.armosec.io


    Click on Settings (bottom left corner)


    Under the Agent Access Keys section, generate a new access key or use an existing one.


    Copy and save the access key, as it will not appear again.


    Using the API Key in Requests Pass the access key in the request headers under the key x-api-key as shown below:

    curl -X ''POST'' \

    ''https://api.armosec.io/api/v1/some-endpoint'' \

    -H ''accept: application/json'' \

    -H ''x-api-key: YOUR_ACCESS_KEY'' \

    -d ''{}'''
  title: ARMO PLATFORM Repository API
  version: 1.0.0
servers:
- url: https://api.armosec.io/api/v1
- url: http://api.armosec.io/api/v1
security:
- customerGUID:
  - '[]'
- accessKey:
  - '[]'
- openID:
  - '[]'
tags:
- name: Repository
paths:
  /repositoryPosture/failedControls:
    post:
      description: Get failed controls summary for a specific repository or file
      tags:
      - Repository
      operationId: failedControlsRepositoryPosture
      responses:
        '200':
          $ref: '#/components/responses/RepoScanningFailedControlSummaryResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filePath:
                  description: In case kind is "file", FilePath should be provided
                  type: string
                  x-go-name: FilePath
                  example: '"path/to/file"'
                kind:
                  $ref: '#/components/schemas/RepoEntityKind'
                reportGUID:
                  description: Report GUID
                  type: string
                  x-go-name: ReportGUID
                  example: d415eb5b-0902-45cd-b6df-9a2e1ff4348b
      summary: Failed controls repository posture
      x-summary-source: derived
  /repositoryPosture/files:
    post:
      description: 'Returns list of file summaries of repository posture report


        When ''Name'' query param is used, any files which contain the value in their name will be filtered out (supports partial match)


        Request object example

        Get file summary of report with GUID "f1580557-5faf-417d-85c7-c6cc7fb5cb57"

        {

        "pageSize": 100,

        "pageNum": 1,

        "orderBy": "",

        "innerFilters": [

        {

        "reportGUID": "f1580557-5faf-417d-85c7-c6cc7fb5cb57"

        }

        ]

        }'
      tags:
      - Repository
      summary: Get file summary of repository posture report
      operationId: repositoryPostureFiles
      parameters:
      - x-go-name: Name
        description: Used to filter out repositories or files by name (partial match). Any repositories containing the value in their name, OR repositories with files containing the value in their name, will be filtered out.
        name: name
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RepoPostureEntitySummaryResponse'
  /repositoryPosture/repositories:
    post:
      description: 'Returns list of repo summaries of the latest posture report


        When ''Name'' query param is used, any *repositories* OR *files* in the repository which contain the value in their name will be filtered out (supports partial match)


        Request object example

        Get repository summaries with failed control IDs "C-0016" or "C-0001"

        {

        "pageSize": 100,

        "pageNum": 1,

        "orderBy": "",

        "innerFilters": [

        {

        "controlsInfo.failed.id": "C-0016,C-0001"

        }

        ]

        }'
      tags:
      - Repository
      summary: Get repository summary of repository posture report
      operationId: repositoryPostureRepositories
      parameters:
      - x-go-name: Name
        description: Used to filter out repositories or files by name (partial match). Any repositories containing the value in their name, OR repositories with files containing the value in their name, will be filtered out.
        name: name
        in: query
        schema:
          type: string
      - x-go-name: OnlyLastScans
        description: Optional param - return only last posture report for each repository. "true" by default.
        name: onlyLastScans
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/RepoPostureEntitySummaryResponse'
  /repositoryPosture/resources:
    post:
      description: Returns list of resources summaries of a file in a repository posture report
      tags:
      - Repository
      summary: Get resource summary of repository posture report
      operationId: repositoryPostureResources
      responses:
        '200':
          $ref: '#/components/responses/RepoPostureResourceSummary'
  /uniqueValues/repositoryPosture/files:
    post:
      description: 'Request object example

        Get the following unique fields for repository files summary of report:

        Folder

        File Name

        File Type

        Failed Control IDs

        Failed Control Severities

        File Committer Names

        File Commit Hashes


        {

        "fields": {

        "designators.attributes.fileDirectory": "",

        "name": "",

        "designators.attributes.fileType": "",

        "controlsInfo.failed.id": "",

        "controlsInfo.failed.baseScore": "",

        "designators.attributes.lastFileCommitterName": "",

        "designators.attributes.lastFileCommitHash": ""

        },

        "innerFilters": [

        {

        "reportGUID": "f1580557-5faf-417d-85c7-c6cc7fb5cb57"

        }

        ]

        }


        Inner filters examples:


        Filter files named "adservice.yaml" OR "cartservice.yaml"

        "name": "adservice.yaml,cartservice.yaml"


        Filter by two failed controls (C-0016 and C-0001):

        "controlsInfo.failed.id": "C-0016,C-0001"


        Filter by two severities - low or medium (Low baseScore values are 1-3, Medium 4-6, etc.):

        "controlsInfo.failed.id": "1,2,3,4,5,6"'
      tags:
      - Repository
      summary: Get values for inner filter of /repositoryPosture/files POST requests
      operationId: uniqueValuesRepositoryPostureFiles
      responses:
        '200':
          $ref: '#/components/responses/RepoPostureUniqueValuesResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                countFields:
                  description: Include hit counts for each field
                  type: boolean
                  x-go-name: CountFields
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  x-go-name: Fields
                innerFilters:
                  description: Which elements of the list to return, each field can hold multiple values separated by comma
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
                  x-go-name: InnerFilters
                  example: "\": {\"severity\": \"High,Medium\",\t\t\"type\": \"61539,30303\"}"
                pageNum:
                  description: for apis that support pagination
                  type: integer
                  format: int64
                  x-go-name: PageNum
                pageSize:
                  type: integer
                  format: int64
                  x-go-name: PageSize
                since:
                  type: string
                  format: date-time
                  default: since - beginning of the time, until - now)
                  x-go-name: Since
                ticketManager:
                  $ref: '#/components/schemas/TicketManager'
                until:
                  type: string
                  format: date-time
                  x-go-name: Until
        required: true
  /uniqueValues/repositoryPosture/repositories:
    post:
      description: 'Request object example

        Get the following unique fields for repository summary of report:

        Repository Name

        Number of files

        Scan time

        Failed Control IDs

        Failed Control Severities


        {

        "fields": {

        "name": "",

        "childCount": "",

        "timestamp": "",

        "controlsInfo.failed.id": "",

        "controlsInfo.failed.baseScore": ""

        },

        "innerFilters": [

        {

        "reportGUID": "f1580557-5faf-417d-85c7-c6cc7fb5cb57"

        }

        ]

        }


        Inner filters examples:


        Filter repositories named "kubescape_master" OR "kubescape_dev"

        "name": "kubescape_master,kubescape_dev"


        Filter by two failed controls (C-0016 and C-0001):

        "controlsInfo.failed.id": "C-0016,C-0001"


        Filter by two severities - low or medium (Low baseScore values are 1-3, Medium 4-6, etc.):

        "controlsInfo.failed.id": "1,2,3,4,5,6"'
      tags:
      - Repository
      summary: Get values for inner filter of /repositoryPosture/repositories POST requests
      operationId: uniqueValuesRepositoryPostureRepos
      responses:
        '200':
          $ref: '#/components/responses/RepoPostureUniqueValuesResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                countFields:
                  description: Include hit counts for each field
                  type: boolean
                  x-go-name: CountFields
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  x-go-name: Fields
                innerFilters:
                  description: Which elements of the list to return, each field can hold multiple values separated by comma
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
                  x-go-name: InnerFilters
                  example: "\": {\"severity\": \"High,Medium\",\t\t\"type\": \"61539,30303\"}"
                pageNum:
                  description: for apis that support pagination
                  type: integer
                  format: int64
                  x-go-name: PageNum
                pageSize:
                  type: integer
                  format: int64
                  x-go-name: PageSize
                since:
                  type: string
                  format: date-time
                  default: since - beginning of the time, until - now)
                  x-go-name: Since
                ticketManager:
                  $ref: '#/components/schemas/TicketManager'
                until:
                  type: string
                  format: date-time
                  x-go-name: Until
        required: true
  /uniqueValues/repositoryPosture/resources:
    post:
      description: Get values for inner filter of /repositoryPosture/resources POST requests
      tags:
      - Repository
      operationId: uniqueValuesRepositoryPostureResources
      responses:
        '200':
          $ref: '#/components/responses/RepoPostureUniqueValuesResponse'
