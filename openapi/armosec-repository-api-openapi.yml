        content:
          application/json:
            schema:
              type: object
              properties:
                countFields:
                  description: Include hit counts for each field
                  type: boolean
                  x-go-name: CountFields
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  x-go-name: Fields
                innerFilters:
                  description: Which elements of the list to return, each field can hold multiple values separated by comma
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
                  x-go-name: InnerFilters
                  example: "\": {\"severity\": \"High,Medium\",\t\t\"type\": \"61539,30303\"}"
                pageNum:
                  description: for apis that support pagination
                  type: integer
                  format: int64
                  x-go-name: PageNum
                pageSize:
                  type: integer
                  format: int64
                  x-go-name: PageSize
                since:
                  type: string
                  format: date-time
                  default: since - beginning of the time, until - now)
                  x-go-name: Since
                ticketManager:
                  $ref: '#/components/schemas/TicketManager'
                until:
                  type: string
                  format: date-time
                  x-go-name: Until
        required: true
      summary: Unique values repository posture resources
      x-summary-source: derived
