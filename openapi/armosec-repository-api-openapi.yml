          type: string
          x-go-name: Name
          example: '"my-repo"'
        reportGUID:
          type: string
          x-go-name: ReportID
        statusText:
          description: Status of the entity
          type: string
          x-go-name: StatusText
          example: failed
        ticketManager:
          $ref: '#/components/schemas/TicketManager'
        tickets:
