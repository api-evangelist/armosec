openapi: 3.2.0
info:
  description: 'Documentation of Armo Platform API

    How to get the API key Get the API key from the Armo platform


    Navigate to the https://cloud.armosec.io


    Click on Settings (bottom left corner)


    Under the Agent Access Keys section, generate a new access key or use an existing one.


    Copy and save the access key, as it will not appear again.


    Using the API Key in Requests Pass the access key in the request headers under the key x-api-key as shown below:

    curl -X ''POST'' \

    ''https://api.armosec.io/api/v1/some-endpoint'' \

    -H ''accept: application/json'' \

    -H ''x-api-key: YOUR_ACCESS_KEY'' \

    -d ''{}'''
  title: ARMO PLATFORM Jira Integration API
  version: 1.0.0
servers:
- url: https://api.armosec.io/api/v1
- url: http://api.armosec.io/api/v1
security:
- customerGUID:
  - '[]'
- accessKey:
  - '[]'
- openID:
  - '[]'
tags:
- name: JiraIntegration
paths:
  /integrations/jira/configV2:
    post:
      description: Save new Jira integration configuration
      tags:
      - JiraIntegration
      operationId: saveJiraConfig
      responses:
        '200':
          description: ''
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraConfig'
      summary: Save jira config
      x-summary-source: derived
  /integrations/jira/issueTypesV2/fields/search:
    post:
      tags:
      - JiraIntegration
      summary: Get a filtered Jira field values list
      operationId: getJiraFieldValues
      responses:
        '200':
          $ref: '#/components/responses/JiraEntitiesResp'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  fieldId:
                    type: string
                    x-go-name: FieldId
                  issueTypeId:
                    type: string
                    x-go-name: IssueTypeId
                  projectId:
                    type: string
                    x-go-name: ProjectId
                  query:
                    type: string
                    x-go-name: Query
                  siteId:
                    type: string
                    x-go-name: SiteId
  /integrations/jira/issueTypesV2/schema/search:
    post:
      description: 'Note: Only required fields (that do not have a default value) are retrieved.'
      tags:
      - JiraIntegration
      summary: Get Jira fields schemas list for an issue type
      operationId: getJiraFieldsSchemas
      responses:
        '200':
          $ref: '#/components/responses/JiraFieldsSchemasResp'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  includeFields:
                    type: string
                    x-go-name: IncludeFields
                  issueTypeId:
                    type: string
                    x-go-name: IssueTypeId
                  projectId:
                    type: string
                    x-go-name: ProjectId
                  siteId:
                    type: string
                    x-go-name: SiteId
  /integrations/jira/issueTypesV2/search:
    post:
      description: 'Note: Issue types are filtered to action types (exclude epics and subtasks).'
      tags:
      - JiraIntegration
      summary: Get Jira issue types list
      operationId: getJiraIssueTypes
      responses:
        '200':
          $ref: '#/components/responses/JiraEntitiesResp'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginationRequest'
  /integrations/jira/issueV2:
    post:
      description: '### Incident tickets (new)


        You can create a Jira ticket for a **runtime incident** by setting `issueType` to `"incident"` and

        passing exactly **one** subject with `incidentGUID`.


        Example:


        ```json

        {

        "collaborationGUID": "collab-guid",

        "issueType": "incident",

        "subjects": [

        {

        "incidentGUID": "11111111-2222-3333-4444-555555555555",

        "cluster": "my-cluster",

        "namespace": "my-namespace",

        "kind": "Deployment",

        "name": "my-workload"

        }

        ],

        "jiraCreateIssueFields": {

        "siteId": "site1",

        "projectId": "project1",

        "issueTypeId": "issuetype1"

        },

        "fields": {}

        }

        ```'
      tags:
      - JiraIntegration
      summary: Create a Jira issue (ticket)
      operationId: createJiraIssue
      responses:
        '201':
          $ref: '#/components/responses/createJiraIssueResp'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraCreateIssueRequest'
  /integrations/jira/projectsV2/search:
    post:
      description: Get Jira projects list
      tags:
      - JiraIntegration
      operationId: getJiraProjects
      responses:
        '200':
          $ref: '#/components/responses/JiraProjectsResp'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginationRequest'
      summary: Get jira projects
      x-summary-source: derived
