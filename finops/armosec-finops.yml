description: >-
  FinOps view of ARMO spend. ARMO Platform is a managed SaaS billed primarily on
  the size of the protected environment - the number of vCPUs and cloud resources
  - plus a chosen support tier, with a free tier to start and additional setup /
  integration fees for on-premises and air-gapped installations. The dominant
  cost driver is the count of protected vCPUs across connected Kubernetes
  clusters. The underlying Kubescape engine is open source and free to self-host,
  trading the subscription fee for your own infrastructure and operational cost.
notes: >-
  Per-vCPU rates are not published by ARMO; verify via the pricing page or a
  sales quote. For self-hosted Kubescape, the dominant costs are the compute and
  operational overhead of running the operator and sensors rather than an ARMO
  license fee.
