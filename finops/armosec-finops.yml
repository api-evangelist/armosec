meters:
- name: protected_vcpu
  description: Number of protected vCPUs across connected Kubernetes clusters; the primary ARMO Platform billing driver.
  unit: vcpu
  aggregation: max
  dimensions:
  - account
  - cluster
- name: support_tier
  description: Selected support tier, which adjusts the subscription cost.
  unit: tier
  aggregation: max
  dimensions:
  - account
- name: onprem_setup
  description: One-time setup and integration fees for on-premises / air-gapped installations.
  unit: fee
  aggregation: sum
  dimensions:
  - account
- name: self_hosted_compute
  description: Infrastructure cost of running open-source Kubescape yourself (no ARMO invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track protected vCPU counts per cluster; monitor how scanning scope maps to the subscription driver.
- name: Allocation
  description: Map clusters and workloads to teams so security spend is attributable to internal cost centers.
- name: Optimization
  description: Right-size protected scope; use exceptions to suppress accepted risks; self-host Kubescape where the vCPU-based subscription outweighs owned infrastructure cost.
- name: Accountability
  description: Assign owners per cluster; review vCPU-based spend and support tier against budget periodically.
